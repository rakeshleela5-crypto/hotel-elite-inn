name = "hotel-elite-inn"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "hotel-elite-inn-db"
database_id = "PENDING_DATABASE_CREATION"

# Public environment variables (safe to commit)
[vars]
HOTEL_NAME  = "Hotel Elite Inn"
HOTEL_PHONE = "+919999999999"
HOTEL_EMAIL = "contact@hoteleliteinn.com"

# ──────────────────────────────────────────────────────────
# SECRET bindings — NEVER put real values here.
# Run these ONE TIME in your terminal to save them encrypted:
#
#   npx wrangler secret put RAZORPAY_KEY_ID
#   npx wrangler secret put RAZORPAY_KEY_SECRET
#   npx wrangler secret put ADMIN_SECRET
#
# Find your Razorpay keys at:
#   https://dashboard.razorpay.com/ → Settings → API Keys
# ──────────────────────────────────────────────────────────
